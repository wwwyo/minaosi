<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minaosi prototype — notes</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* Hallmark · component: findings-panel · genre: editorial · theme: mono+accent
   * tone: austere · anchor: single accent
   * states: default · hover · focus · active · selected · resolved · dismissed · suppressed
   */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: clip; }
  body {
    font-family: var(--font-ui);
    color: var(--color-ink); background: var(--color-paper);
    font-size: 16px; line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
    border-radius: var(--radius-sm);
  }

  .editor { max-width: 680px; margin: 0 auto; padding: 48px 24px 160px; }
  .doc-title { font-size: 30px; font-weight: 700; line-height: 1.4; margin: 0 0 8px; font-style: normal; }
  .doc-meta { color: var(--color-faint); font-size: 13px; margin-bottom: 40px; }
  .doc-body h2 { font-size: 22px; font-weight: 700; margin: 48px 0 8px; font-style: normal; }
  .doc-body p { margin: 0 0 24px; }
  .fig { margin: 8px 0 32px; border-radius: var(--radius-md); background: var(--color-hover-bg); aspect-ratio: 16/9; display: flex; align-items: flex-end; }
  .fig span { font-size: 12px; color: var(--color-faint); padding: 8px 12px; }

  /* ---- in-text marks ---- */
  mark.mk { background: none; color: inherit; }
  .mk {
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out);
  }
  .mk:hover { background: var(--color-hover-bg); }
  .mk[data-sel] {
    background: var(--color-suggest-bg);
    box-shadow: 0 0 0 1.5px var(--color-accent);
    border-radius: var(--radius-sm);
  }

  /* inline before→after suggestion */
  .fx { cursor: pointer; }
  .fx-del { text-decoration: line-through; text-decoration-thickness: 1.5px;
    text-decoration-color: var(--color-strike); color: var(--color-dim); }
  .fx-ins {
    color: var(--color-accent-ink); background: var(--color-suggest-bg);
    text-decoration: none;
    border-radius: var(--radius-sm);
    padding: 0 3px; margin-left: 2px;
  }

  /* apply tooltip on suggestion hover — 位置は JS がカーソル下の行に合わせて置く */
  .fx { position: relative; }
  .fx-tip {
    position: absolute; top: 0; left: 0;
    transform: translateX(-50%) translateY(calc(-100% + 2px));
    padding-bottom: 4px;
    opacity: 0; pointer-events: none;
    transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    z-index: 45; white-space: nowrap;
  }
  .fx:hover .fx-tip, .fx:focus-within .fx-tip { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(-100%); }
  .fx-tip button {
    display: inline-flex; align-items: center; gap: 4px;
    font: inherit; font-size: 12px; font-weight: 700; line-height: 1;
    background: var(--color-ink); color: var(--color-paper);
    border: 1px solid var(--color-ink); border-radius: var(--radius-md);
    padding: 7px 10px; cursor: pointer;
    box-shadow: 0 4px 14px oklch(0% 0 0 / .25);
    transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .fx-tip button svg { width: 11px; height: 11px; display: block; }
  .fx-tip button:active { transform: translateY(1px); }
  .fx-tip button:hover { opacity: .85; }

  .bmark { border-left: 3px solid var(--color-hairline); padding-left: 10px; cursor: pointer; }
  .bmark:hover { border-left-color: var(--color-ink); }
  .bmark[data-sel] { border-left-color: var(--color-accent); background: var(--color-hover-bg); }
  .done-mark { opacity: .4; }

  /* ---- panel ---- */
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 340px; z-index: 40;
    background: var(--color-panel); border-left: 1px solid var(--color-edge);
    display: flex; flex-direction: column; font-size: 13px; line-height: 1.6;
  }
  .panel header { padding: 14px 16px 12px; border-bottom: 1px solid var(--color-hairline); }
  .panel h3 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .02em; }
  .panel .prog { color: var(--color-dim); font-size: 11.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .list { overflow-y: auto; flex: 1; }
  .list .empty { padding: 24px 16px; color: var(--color-faint); font-size: 12.5px; text-align: center; }

  .filters { display: flex; gap: 2px; margin-top: 10px; }
  .filters button {
    font: inherit; font-size: 11.5px; font-weight: 600;
    border: 1px solid transparent; background: transparent;
    color: var(--color-dim); padding: 3px 8px; cursor: pointer; border-radius: var(--radius-md);
    transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
  }
  .filters button:hover { color: var(--color-ink); background: var(--color-hover-bg); }
  .filters button:active { transform: translateY(1px); }
  .filters button.on { color: var(--color-ink); background: var(--color-card); border-color: var(--color-edge); }

  .n-item {
    display: block; width: 100%; padding: 12px 16px;
    border-bottom: 1px solid var(--color-hairline);
    border-left: 3px solid transparent;
    cursor: pointer; position: relative;
    transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  }
  .n-item:hover { background: var(--color-hover-bg); }
  .n-item[data-sel] { border-left-color: var(--color-ink); background: var(--color-card); }
  .n-item .detail { display: none; }
  .n-item[data-sel] .detail { display: block; }
  .n-item .meta { display: flex; align-items: baseline; gap: 6px; padding-right: 54px; }
  .n-item .kind { font-size: 10px; letter-spacing: .08em; color: var(--color-dim); font-weight: 700; }
  .n-item .ttl { font-weight: 600; font-size: 13px; margin-top: 2px; padding-right: 54px; }
  .n-item .rsn { color: var(--color-dim); font-size: 12.5px; margin-top: 4px; }
  .n-item.is-resolved .ttl, .n-item.is-resolved .rsn { color: var(--color-faint); }

  .n-item .detail .rsn { margin-top: 8px; }

  .src { margin-top: 4px; }
  .src a { color: var(--color-accent-ink); text-decoration: underline; text-underline-offset: 2px; font-size: 11.5px; font-weight: 600; }

  .acts { position: absolute; top: 16px; right: 12px; display: flex; gap: 6px; align-items: center; }
  .acts button {
    width: 28px; height: 28px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--color-edge); background: var(--color-card);
    border-radius: var(--radius-md); cursor: pointer; color: var(--color-dim);
    transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  }
  .acts button svg { width: 13px; height: 13px; display: block; }
  .acts button:hover { border-color: var(--color-ink); color: var(--color-ink); }
  .acts button:active { transform: translateY(1px); }
  .acts button.primary { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-paper); }
  .acts button.primary:hover { opacity: .85; }
  .acts button.trash {
    width: 20px; height: 20px; padding: 0;
    border: 0; background: transparent; color: var(--color-faint);
  }
  .acts button.trash svg { width: 12px; height: 12px; }
  .acts button.trash:hover { color: var(--color-dim); }

  .run-btn {
    font: inherit; font-size: 12px; font-weight: 700;
    background: var(--color-ink); color: var(--color-paper);
    border: 1px solid var(--color-ink); border-radius: var(--radius-md);
    padding: 6px 14px; cursor: pointer;
    transition: opacity var(--dur-fast) var(--ease-out);
  }
  .run-btn:hover:not(:disabled) { opacity: .85; }
  .run-btn:active:not(:disabled) { transform: translateY(1px); }
  .run-btn:disabled { opacity: .5; cursor: not-allowed; }
  .run-btn.sm { font-size: 11px; padding: 3px 10px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 4px; }
  .run-btn .pre { width: 14px; height: 14px; display: block; margin: -1px -1px 0 -2px; }
  .panel .head-row { display: flex; align-items: center; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 6px; border: 0; background: transparent;
    padding: 3px 6px 3px 4px; border-radius: var(--radius-sm); cursor: pointer; color: var(--color-ink); }
  .brand:hover { background: var(--color-hover-bg); }
  .brand .chev { width: 13px; height: 13px; display: block; color: var(--color-faint); }
  .brand:hover .chev { color: var(--color-ink); }
  .head-row .run-btn { margin-left: auto; }
  .brand svg:not(.chev) { width: 17px; height: 17px; display: block; color: var(--color-ink); }
  .brand-name { font-size: 14px; font-weight: 800; letter-spacing: .04em; }
  .icon-btn {
    width: 24px; height: 24px; padding: 0; border: 0; background: transparent;
    color: var(--color-faint); cursor: pointer; border-radius: var(--radius-sm);
    display: inline-flex; align-items: center; justify-content: center;
    transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
  }
  .icon-btn:hover { color: var(--color-ink); background: var(--color-hover-bg); }
  .icon-btn svg { width: 13px; height: 13px; display: block; }
  .fab {
    position: fixed; right: 28px; top: 24px; z-index: 40;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--color-ink); color: var(--color-paper); border: 0;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px oklch(0% 0 0 / .18);
    transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  }
  .fab:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px oklch(0% 0 0 / .24); }
  .fab:active:not(:disabled) { transform: translateY(1px); }
  .fab:disabled { opacity: .55; cursor: default; }

  .with-panel .editor { margin-right: 340px; max-width: 660px; }
  .flash { position: absolute; z-index: 30; pointer-events: none; border-radius: var(--radius-md);
    box-shadow: 0 0 0 2px var(--color-flash-ring); opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<script>
const KINDS = { typo:'誤字', fact:'事実', rule:'日本語ルール', style:'文体規範' };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

const ARTICLE = [
  { t:'h1', h:'なんでこれ存在しているんや' },
  { t:'img', cap:'見出し画像 — Photo by 630shio' },
  { t:'p', h:'世の中には「なんでこれ存在しているんや」ってのありますよね。例えば、折り畳み傘の袋とか。なんか袋に入れたらカビ生えそうで使いたくないし、100%の確率で紛失する。無くす前提で設計された袋、なんのためにあるんや。' },
  { t:'p', h:'そんなことを言ってたら、「折り畳み傘をカバンに入れて持ち運ぶ」場合には必要という指摘を受けました。ごもっともです。世の中にはなんであるか分からなくてもどこかで必要とされているものが多くあるんです。' },
  { t:'h2', h:'地銀はなんであるんや。' },
  { t:'p', h:'さて、なんであるかよく分からないもの。私にとっての直近の代表例は地銀です。' },
  { t:'p', h:'私は毎年沖縄へ行くほどの沖縄大好きンチュなんですが、沖縄らしさを一番感じるものはやはり琉球銀行でしょう。沖縄の海、ソーキ、陽気な音楽、暑さそして赤々と輝く銀行。' },
  { t:'img', cap:'メガバンクが見当たらなくて、ナイチャーショック' },
  { t:'p', h:'琉球銀行はまさしく沖縄を代表する地銀です。沖縄では地銀がメインバンクとして主流ですが、ナイチャー(本土の人)からすると地銀というものに馴染みがありません。普段の生活ではメガバンクとネット銀行で機能として十分ですし、都内ではその名前を見かけることもないでしょう。ちなみに地銀は全国に@@96行@@あります（結構多い）。さて、地銀はなんであるんや。' },
  { t:'h2', h:'銀行の基本機能は変わらない' },
  { t:'p', h:'傘袋の例を思い出すと、私が見落とした機能があるのかもしれない。ということでメガバンクと地銀の機能の違いを述べたいんだが…..実は基本機能は変わらない。私のような凡夫は銀行を大きな金庫だと思っているが、それは本質的ではなくお金の仲介と考える方が適切です。銀行の機能は大きく決済、@@機関変換@@、情報生産の3つに分けられる。' },
  { t:'p', h:'決済は身近な例。商品やサービスの取引で発生した支払いを@@利行@@し、債権・債務を清算する機能。クレジットカードも決済に使う手段の一つ。' },
  { t:'p', h:'私たち個人や企業はお金を銀行へ預けているが、ただ預けられているだけではなく、お金を必要とする企業へ貸し出されている。とはいえ、私たちはそんなことを意識せずいつでもお金を引き出せるわけだが、貸し出し先の企業は長期の資金を必要としている。この預金と貸出の期間の違いを仲介する役割を担っている。' },
  { t:'p', h:'銀行は私たちのお金を貸し出している@@わけ@@だが、当然誰にでも貸す@@わけ@@じゃない。返せなかったら困りますからね。ということで返せそうかどうかを精査している@@わけ@@。' },
  { t:'h2', h:'企業ってな337.5万者あんねん' },
  { t:'p', h:'中小企業庁の2021年6月時点の集計では、@@事業所数の合計は337.5万者@@（中小企業336.5万者）。毎回聞いて驚けるんだけどめっちゃある。' },
  { t:'p', h:'つまり、銀行の機能である期間変換や情報生産を必要とする企業は多く、メガバンクだけですべてを同じ深さで支援するのは簡単ではなさそうです。いや、そんなネガティブな事情だけなのか。実はポジティブな事情もある。' },
  { t:'h2', h:'地域を支える銀行、それが地銀' },
  { t:'p', h:'国内経済の成長が鈍い中、人口減少や人手不足は地域企業にとって大きな課題です。中小企業の生産性を高めることは、日本経済の将来にもつながります。' },
  { t:'p', h:'では、肝心のメガバンクさんは国内企業だけでなく海外にも目を向けている。MUFGの統合報告書によると、@@2023年度の営業純益に占める海外の割合は56%@@でした。もちろん海外で収益を上げる動きも重要です。' },
  { t:'p', h:'では、国内の地域企業を誰が支えるのか。その役割を担う重要な存在が地銀です。地域に根ざした企業に近い立場で、その強みを理解しやすいのが地銀です。金の貸し借りだけではなく、企業のビジネスを理解して元気になるような経営サポートをする役割も担っているんです。' },
  { t:'h2', h:'ソーキそば食いたい' },
  { t:'p', h:'@@ということで@@、「なんで地銀が存在しているんや」と思ってたんだけど、僕の大好きなソーキそばがあるのは地銀のおかげでした。' },
];

const FINDINGS = [
  { id:1, kind:'typo', block:10, span:'機関変換', fix:{from:'機関変換',to:'期間変換'},
    title:'「期間変換」の誤変換',
    reason:'銀行機能の3区分（決済・期間変換・情報生産）の文脈です。「機関変換」という機能は存在しません。「期間変換」に直してください。' },
  { id:2, kind:'typo', block:11, span:'利行', fix:{from:'利行',to:'履行'},
    title:'「履行」の誤字',
    reason:'「支払いを履行し、債権・債務を清算する」の文脈です。「履行」に直してください。' },
  { id:3, kind:'fact', block:8, span:'96行', fix:{from:'96行',to:'62行'},
    title:'地銀の行数',
    reason:'地方銀行協会の加盟行は62行です。「96行」が何を数えた数字か確認してください。範囲が不明なら62行に直します。',
    source:{ label:'地方銀行協会', url:'https://www.chiginkyo.or.jp/', loc:'加盟行一覧（62行）' } },
  { id:4, kind:'fact', block:15, span:'事業所数の合計は337.5万者', fix:{from:'事業所数の合計は337.5万者',to:'企業数の合計は337.5万者'},
    title:'企業数の集計と定義',
    reason:'337.5万者は大企業を含む全企業数です（事業所数ではありません）。「企業数」に直すか、事業所数を数えた一次出典に差し替えてください。',
    source:{ label:'中小企業庁「企業数等の調査」（2023年）', url:'https://www.chusho.meti.go.jp/koukai/chousa/chu_kigyocnt/2023/231213chukigyocnt.html', loc:'企業数の集計（全企業337.5万者）' } },
  { id:5, kind:'fact', block:19, span:'2023年度の営業純益に占める海外の割合は56%',
    fix:{from:'2023年度の営業純益に占める海外の割合は56%',to:'2023年度の営業純益に占める海外の割合は56%（MUFG Report 2024より）'},
    title:'MUFG の海外収益比率',
    reason:'MUFG Report 2024の管理計数（モルガン・スタンレー持分法損益を含む）ベースの数値です。出典を明記してください。',
    source:{ label:'MUFG Report 2024', url:'https://www.mufg.jp/dam/ir/report/disclosure/pdf/ir2024_03_ja.pdf', loc:'経営成績 セグメント情報（海外収益比率）' } },
  { id:6, kind:'rule', block:13, span:'わけ', all:true,
    fixes:[{from:'わけ',to:'のだ'},{from:'わけ',to:'のではない'},{from:'わけ',to:'のだ'}],
    title:'語尾「わけ」の連続',
    reason:'同一段落内で語尾「わけ」が3回連続しています。修正案のうち2箇所を適用してください。' },
  { id:7, kind:'rule', block:8, suppressed:true,
    title:'です・ます調と常体の混在',
    reason:'敬体（「です」「ありません」）と常体（「ないでしょう」「あるんや」）が段落内で混在しています。あなたの文体規範では混在を許容しているため、この指摘は抑制され UI には表示されません。' },
  { id:8, kind:'style', block:22, span:'ということで', fix:{from:'ということで',to:'つまり'},
    title:'接続詞「ということで」の多用',
    reason:'この記事内で3回目です。作者の過去記事でも多用傾向にあります。意図的な口癖なら残しても良いですが、1箇所は「つまり」への置き換えや削除を検討してください。' },
];

const ICON_APPLY = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON_TRASH = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON_UNDO = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 14 4 9l5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const fstate = new Map(FINDINGS.map(f => [f.id, 'open']));
const fapplied = new Map(); // fid -> Set<fix index>（複数 fix の部分適用を記録）
let filter = 'open';
let selFid = null;
let reviewed = false;
let panelOpen = false;
let running = false;
const fById = id => FINDINGS.find(f => f.id === id);
const counts = () => {
  let o=0,r=0,d=0;
  for (const f of FINDINGS) { if (f.suppressed) continue;
    const s=fstate.get(f.id); s==='open'?o++:s==='resolved'?r++:d++; }
  return {o,r,d};
};

function articleHTML() {
  return ARTICLE.map((b,i) => {
    const fs = FINDINGS.filter(f => f.block===i);
    let inner = esc(b.h||'');
    for (const f of (reviewed ? fs.filter(x=>x.span) : [])) {
      const pat = `@@${f.span}@@`;
      const st = fstate.get(f.id);
      const fx = f.fixes || (f.fix ? [f.fix] : null);
      if (fx && !f.suppressed) {
        const applied = fapplied.get(f.id) || new Set();
        const parts = inner.split(pat);
        inner = parts.map((p,i) => {
          if (i === parts.length-1) return p;
          const fix = fx[Math.min(i, fx.length-1)];
          const sel = f.id===selFid ? ' data-sel' : '';
          let rep;
          if (st==='resolved' && f.id===selFid)
            rep = `<span class="fx mk" data-fid="${f.id}" tabindex="0"${sel}
              role="button" aria-label="${esc(f.title)}"><del class="fx-del">${esc(fix.from)}</del><ins class="fx-ins">${esc(fix.to)}</ins></span>`;
          else if (applied.has(i) || st==='resolved') rep = esc(fix.to);
          else if (st==='deleted') rep = esc(f.span);
          else rep = `<span class="fx mk" data-fid="${f.id}" tabindex="0"${sel}
            role="button" aria-label="${esc(f.title)}"><del class="fx-del">${esc(fix.from)}</del><ins class="fx-ins">${esc(fix.to)}</ins><span class="fx-tip"><button data-apply="${f.id}:${i}">${ICON_APPLY}適用</button></span></span>`;
          return p + rep;
        }).join('');
      } else {
        const sel = f.id===selFid ? ' data-sel' : '';
        const rep = st==='open' ? `<mark class="mk" data-fid="${f.id}" tabindex="0"${sel}>${esc(f.span)}</mark>` : esc(f.span);
        inner = inner.split(pat).join(rep);
      }
    }
    inner = inner.replace(/@@/g,'');
    if (b.t==='img') return `<figure class="fig" data-block="${i}"><span>${esc(b.cap)}</span></figure>`;
    const pf = reviewed ? fs.find(f=>!f.span && fstate.get(f.id)==='open' && !f.suppressed) : undefined;
    const bcls = pf ? 'bmark' : '';
    const battr = pf ? ` data-fid="${pf.id}" tabindex="0"` : '';
    if (b.t==='h1') return `<h1 class="doc-title" data-block="${i}">${inner}</h1>`;
    if (b.t==='h2') return `<h2 data-block="${i}" class="${bcls}"${battr}>${inner}</h2>`;
    return `<p data-block="${i}" class="${bcls}"${battr}>${inner}</p>`;
  }).join('');
}

function actsHTML(f) {
  const s = fstate.get(f.id);
  if (s==='resolved')
    return `<div class="acts"><button data-revert="${f.id}" title="適用を元に戻す" aria-label="適用を元に戻す">${ICON_UNDO}</button></div>`;
  if (s==='deleted')
    return `<div class="acts"><button data-revert="${f.id}" title="復元" aria-label="復元">${ICON_UNDO}</button></div>`;
  const apply = ((f.fix || f.fixes) && !f.suppressed)
    ? `<button class="primary" data-apply="${f.id}" title="適用" aria-label="適用">${ICON_APPLY}</button>` : '';
  return `<div class="acts">${apply}<button class="trash" data-delete="${f.id}" title="削除" aria-label="削除">${ICON_TRASH}</button></div>`;
}

const FAB_ICON = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const LOGO_VARIANTS = {
  check: `<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
    <path d="M3.5 5.5h9M3.5 9.5h9M3.5 13.5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M10.8 14.6l2.1 2.1 4.1-4.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  caret: `<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
    <path d="M3.5 5.5h9M3.5 9.5h9M3.5 13.5h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M10.5 16.5l3-6 3 6M10.5 16.5h6" stroke="var(--color-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  pen: `<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
    <path d="M3.5 5.5h13M3.5 9.5h9M3.5 13.5h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M11.5 2.5h5M14 2.5v4" stroke="var(--color-accent)" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  paper: `<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
    <rect x="4" y="3" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
    <path d="M7 7.5h6M7 10.5h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M7 13.5l2 2 4-4.5" stroke="var(--color-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  nib: `<svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
    <path d="M4 15.5c3-1 4.5-6.5 4.5-9.5L12 9c2.5 1.5 4 4.5 4 6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 15.5l1.8-4.4L8 13z" fill="var(--color-accent)" stroke="var(--color-accent)" stroke-width="1" stroke-linejoin="round"/></svg>`,
  m2: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
    <path d="M3 19V8l4.5-3L12 8v11"/><path d="M12 8l4.5-3L21 8v11"/></svg>`,
  brackets: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
    <path d="M10 4H5v16h5"/><path d="M14 4h5v16h-5"/></svg>`,
  frames: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
    <path d="M13 4H5v12h8"/><path d="M11 20h8V8h-8"/></svg>`,
  loop: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
    <path d="M5 5v14h9c3 0 5-2 5-5V5"/><path d="M10 5v9h4"/></svg>`,
  margin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
    <path d="M5 4v16"/><path d="M9 7h8"/><path d="M9 12h11"/><path d="M9 17h8"/><path d="M20 9v6"/></svg>`,
  none: '',
};
let LOGO_MARK = LOGO_VARIANTS.m2;
let BRAND_TEXT = 'minaosi';

/* design-md 選定用の比較ハーネス（?font=sys|noto|plex|zen & logo=... & state=open）。
   webfont 読込は比較のためだけ — 製品は system stack で webfont は持たない（design.md） */
{
  const qp = new URLSearchParams(location.search);
  const FONT_STACKS = {
    noto: ['"Noto Sans JP"', 'Noto+Sans+JP:wght@400;500;600;700'],
    plex: ['"IBM Plex Sans JP"', 'IBM+Plex+Sans+JP:wght@400;500;600;700'],
    zen:  ['"Zen Kaku Gothic New"', 'Zen+Kaku+Gothic+New:wght@400;500;700;900'],
  };
  const f = qp.get('font');
  if (f && f !== 'sys' && FONT_STACKS[f]) {
    const [stack, fam] = FONT_STACKS[f];
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = `https://fonts.googleapis.com/css2?family=${fam}&display=swap`;
    document.head.appendChild(l);
    document.documentElement.style.setProperty('--font-ui', `${stack}, "Hiragino Sans", "Yu Gothic", sans-serif`);
  }
  const lg = qp.get('logo');
  if (lg && lg in LOGO_VARIANTS) {
    LOGO_MARK = LOGO_VARIANTS[lg];
  }
  if (qp.get('state') === 'open') { reviewed = true; panelOpen = true; }
}
function render() {
  if (!reviewed || !panelOpen) {
    return `<div class="editor"><div class="doc-meta">下書き — note エディタ（模）</div>
      <div class="doc-body">${articleHTML()}</div></div>
      <button class="fab" data-run ${running?'disabled aria-busy="true"':''}
        title="${reviewed?'指摘パネルを開く':'校閲を実行'}" aria-label="${reviewed?'指摘パネルを開く':'校閲を実行'}">${FAB_ICON}</button>`;
  }
  const tabs = [['open','未対応'],['resolved','適用済み'],['deleted','削除']];
  const list = FINDINGS.filter(f => !f.suppressed && fstate.get(f.id)===filter);
  const c = counts();
  const prog = [[`未対応 ${c.o}`,c.o],[`適用済み ${c.r}`,c.r],[`削除 ${c.d}`,c.d]]
    .filter(([,n])=>n>0).map(([t])=>t).join(' · ');
  const meta = '下書き — note エディタ（模） — 校閲実行済み';
  const head = `<header><div class="head-row"><button class="brand" data-close title="パネルを閉じる" aria-label="パネルを閉じる">${LOGO_MARK}<span class="brand-name">${BRAND_TEXT}</span><svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 17 6-6-6-6M13 17l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="run-btn sm" data-rerun ${running?'disabled':''}>${running?'見直し中…':`<svg class="pre" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M5 3v4M3 5h4M19 17v4M17 19h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>見直す`}</button></div>
        <div class="prog">${prog}</div>
        <div class="filters">${tabs.map(([k,l])=>`<button data-f="${k}" class="${filter===k?'on':''}" aria-pressed="${filter===k}">${l}</button>`).join('')}</div>
      </header>`;
  const body = `<div class="list">${list.map(f => `
        <div class="n-item is-${fstate.get(f.id)}" data-fid="${f.id}" tabindex="0" role="button"${f.id===selFid?' data-sel':''}>
          <div class="meta"><span class="kind">${KINDS[f.kind]}</span></div>
          <div class="ttl">${f.title}</div>
          <div class="detail">
            <div class="rsn">${f.reason}</div>
            ${f.source?`<div class="src">出典: <a href="${f.source.url}" target="_blank" rel="noopener">${esc(f.source.label)}</a>${f.source.loc?` — ${esc(f.source.loc)}`:''}</div>`:''}
          </div>
          ${actsHTML(f)}
        </div>`).join('') || '<div class="empty">指摘はありません</div>'}</div>`;
  return `<div class="with-panel">
    <div class="editor"><div class="doc-meta">${meta}</div>
    <div class="doc-body">${articleHTML()}</div></div>
    <aside class="panel" aria-label="指摘一覧">${head}${body}</aside></div>`;
}

function applyFix(key) {
  const [fid, idx] = String(key).split(':').map(Number);
  const f = fById(fid);
  const n = (f?.fixes?.length) || (f?.fix ? 1 : 0);
  if (!n) return;
  const applied = fapplied.get(fid) || new Set();
  if (idx === undefined || Number.isNaN(idx)) for (let i=0;i<n;i++) applied.add(i);
  else applied.add(idx);
  fapplied.set(fid, applied);
  if (applied.size >= n) fstate.set(fid, 'resolved');
  selFid = null;
  mount();
}

function runReview(rerun=false) {
  if (reviewed && !rerun) { panelOpen = true; mount(); return; }
  if (running) return;
  running = true; mount();
  setTimeout(() => {
    running = false; reviewed = true; panelOpen = true;
    for (const f of FINDINGS) fstate.set(f.id, 'open');
    fapplied.clear(); selFid = null;
    mount();
  }, 700);
}

function flashTo(root, fid) {
  const a = root.querySelector(`[data-fid="${fid}"].mk, [data-fid="${fid}"].bmark`);
  if (!a) return;
  a.scrollIntoView({block:'center', behavior:'smooth'});
  const r = a.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'flash';
  el.style.cssText = `left:${r.left-6+scrollX}px;top:${r.top-6+scrollY}px;width:${r.width+12}px;height:${r.height+12}px;`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>{ el.style.opacity=1; setTimeout(()=>{ el.style.opacity=0; setTimeout(()=>el.remove(),200); },450); });
}

function wire(root) {
  root.querySelectorAll('[data-run]').forEach(b => b.onclick = () => runReview(false));
  root.querySelectorAll('[data-rerun]').forEach(b => b.onclick = () => runReview(true));
  root.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { panelOpen = false; mount(); });
  root.querySelectorAll('[data-f]').forEach(b =>
    b.onclick = () => { filter=b.dataset.f; mount(); });
  root.querySelectorAll('.n-item').forEach(it => {
    const select = () => {
      const fid = +it.dataset.fid;
      const was = selFid === fid;
      selFid = was ? null : fid;
      mount(() => { if (!was) flashTo(stage, fid); });
    };
    it.addEventListener('click', e => {
      const fid = +it.dataset.fid;
      const ap = e.target.closest('[data-apply]');
      if (ap)  { applyFix(ap.dataset.apply); return; }
      if (e.target.closest('[data-delete]')) { fstate.set(fid,'deleted'); selFid=null; mount(); return; }
      if (e.target.closest('[data-revert]')) { fstate.set(fid,'open'); fapplied.delete(fid); selFid=null; mount(); return; }
      if (e.target.closest('a')) return;
      select();
    });
    it.addEventListener('keydown', e => {
      if (e.target !== it) return;
      if (e.key==='Enter' || e.key===' ') { e.preventDefault(); select(); }
    });
  });
  root.querySelectorAll('.mk, .bmark').forEach(el => {
    const activate = (e) => {
      const fid = +el.dataset.fid;
      const ap = e?.target?.closest('[data-apply]');
      if (ap) { applyFix(ap.dataset.apply); return; }
      selFid = fid;
      mount(() => {
        const item = stage.querySelector(`.n-item[data-fid="${fid}"]`);
        if (item) item.scrollIntoView({block:'nearest', behavior:'smooth'});
      });
    };
    el.addEventListener('click', activate);
    el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); activate(); } });
  });
  root.querySelectorAll('.fx').forEach(el => {
    const tip = el.querySelector('.fx-tip');
    if (!tip) return;
    const place = (x, y) => {
      const fxr = el.getBoundingClientRect();
      const rects = [...el.getClientRects()];
      if (!rects.length) return;
      const line = rects.find(r => y >= r.top - 2 && y <= r.bottom)
        || rects.reduce((a, b) => Math.abs(b.top - y) < Math.abs(a.top - y) ? b : a);
      const half = tip.offsetWidth / 2;
      const cx = Math.min(Math.max(x, half + 8), innerWidth - half - 8);
      tip.style.left = `${cx - fxr.left}px`;
      tip.style.top = `${line.top - fxr.top}px`;
    };
    el.addEventListener('mouseenter', e => place(e.clientX, e.clientY));
    el.addEventListener('mousemove', e => place(e.clientX, e.clientY));
    el.addEventListener('focusin', () => { const r = el.getClientRects()[0]; if (r) place(r.left + r.width / 2, r.top); });
  });
}

const stage = document.getElementById('stage');
function mount(cb){ stage.innerHTML=''; requestAnimationFrame(()=>{ stage.innerHTML=render(); wire(stage); cb?.(); }); }
mount();
</script>
</body>
