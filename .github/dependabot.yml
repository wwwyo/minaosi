version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # @tanstack/ai 本体と adapter は peer で版が連動するため、別々の PR に分かれないようにする
      tanstack-ai:
        patterns:
          - "@tanstack/ai"
          - "@tanstack/ai-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
