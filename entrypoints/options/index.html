<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>minaosi — オプション</title>
  </head>
  <body>
    <main class="mn options">
      <h1 id="brand" aria-label="minaosi"></h1>
      <form id="settings">
        <fieldset class="mode-cards">
          <legend>校閲の使い方</legend>
          <label class="mode-card">
            <input type="radio" name="mode" value="default" checked disabled />
            <span><strong>minaosiの標準</strong><span class="help">APIキーを用意せずに使う</span></span>
          </label>
          <label class="mode-card">
            <input type="radio" name="mode" value="byok" disabled />
            <span><strong>自分のAPIキー</strong><span class="help">利用料金は登録したキーに請求されます</span></span>
          </label>
        </fieldset>
        <fieldset id="byok-fields" hidden disabled>
          <div class="fld">
            <label for="model">モデル</label>
            <input id="model" type="text" list="models" required maxlength="120" autocomplete="off" placeholder="モデルを選ぶ、または入力" />
            <datalist id="models">
              <option value="claude-sonnet-5">Claude Sonnet 5</option>
              <option value="gpt-5.4-mini">GPT-5.4 mini</option>
            </datalist>
          </div>
          <div class="fld">
            <label for="api-key">APIキー</label>
            <input id="api-key" type="password" required autocomplete="off" spellcheck="false" />
            <div class="help">この拡張に保存し、校閲時に使用します。</div>
          </div>
        </fieldset>
        <button type="submit" class="run-btn" disabled>保存する</button>
        <p id="status" role="status" aria-live="polite">読み込み中…</p>
      </form>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
