<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minaosi — 消化率の状態見本</title>
<style>
  :root { color-scheme: light; --ink: oklch(24% .02 264); --mute: oklch(52% .02 264); --line: oklch(87% .008 264); }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif; }
  .controls { padding: 18px 24px; border-bottom: 1px solid var(--line); background: #f8f8f9; font-size: 12px; }
  .controls p { margin: 0 0 12px; color: var(--mute); }
  .counts { display: flex; gap: 16px; align-items: center; }
  .counts input { width: 64px; margin-left: 6px; padding: 7px; border: 1px solid var(--line); border-radius: 5px; font: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .action { padding: 7px 10px; background: white; border: 1px solid var(--line); border-radius: 5px; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  main { max-width: 760px; padding: 72px 36px; margin: auto; }
  h1 { font-size: clamp(26px, 4vw, 36px); margin: 0 0 60px; line-height: 1.5; }
  .draft { font-size: 18px; line-height: 2; outline-offset: 12px; }
  .draft p { margin: 0 0 28px; }
  .fab { position: fixed; right: 24px; bottom: 24px; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: white; }
  .ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .logo { width: 20px; height: 20px; stroke: var(--ink); }
  .track { stroke: var(--line); stroke-width: 2; fill: none; }
  .fill { stroke: var(--ink); stroke-width: 2; fill: none; transform: rotate(-90deg); transform-origin: center; }
  .panel { position: fixed; top: 0; bottom: 92px; right: 0; width: min(340px, 90vw); padding: 24px; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); background: white; font-size: 13px; overflow: auto; }
  .panel h2 { font-size: 14px; margin: 0 0 32px; }
  .panel p { line-height: 1.8; }
  .panel .detail { color: var(--mute); }
  .panel .action { margin-right: 8px; }
  [hidden] { display: none !important; }
</style>
<div class="controls">
  <p>PRDの状態見本。上の件数入力は見本用です。外部送信・校閲・原稿保存は行いません。右下を押しても消化率は変わりません。</p>
  <div class="counts">
    <label>対応済み<input id="handled" type="number" min="0" value="3"></label>
    <label>指摘数<input id="total" type="number" min="0" value="5"></label>
  </div>
</div>
<main>
  <h1>書く時間を、書くことに使う。</h1>
  <div class="draft" contenteditable="true" role="textbox" aria-label="見本の本文" aria-multiline="true" spellcheck="false">
    <p>書き終えるたびに、もう一度ボタンを押す。小さな操作でも、考えていたことから意識が離れる。</p>
    <p>校閲は文章の区切りで静かに始まる。指摘が届いても、この画面は動かない。</p>
    <p>採用するか、今回は採用しないか。決めるのは書き手だ。右下の円は、その判断をどこまで進めたかだけを表す。</p>
  </div>
</main>
<aside class="panel" id="panel" hidden aria-label="見本の指摘一覧">
  <h2>minaosi</h2>
  <p id="detail" class="detail"></p>
  <p id="remaining"></p>
  <div id="actions">
    <button class="action" id="apply">1件を適用する</button>
    <button class="action" id="delete">1件を削除する</button>
    <button class="action" id="restore">1件を未対応へ戻す</button>
  </div>
</aside>
<button class="fab" id="fab" aria-controls="panel" aria-expanded="false">
  <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
    <circle id="track" class="track" cx="22" cy="22" r="21"></circle>
    <circle id="fill" class="fill" cx="22" cy="22" r="21" pathLength="100"></circle>
  </svg>
  <svg class="logo" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 19V8l4.5-3L12 8v11"/><path d="M12 8l4.5-3L21 8v11"/></svg>
</button>
<script>
  let handled = 3, total = 5;
  const el = id => document.getElementById(id);
  function render() {
    const ratio = total === 0 ? 1 : handled / total;
    el('fill').style.display = ratio === 0 ? 'none' : '';
    el('fill').setAttribute('stroke-dasharray', ratio === 1 ? 'none' : '100');
    el('fill').setAttribute('stroke-dashoffset', String(100 * (1 - ratio)));
    el('handled').value = handled;
    el('handled').max = total;
    el('total').value = total;
    const description = total === 0 ? '指摘はありません' : total + '件中' + handled + '件対応済み';
    el('fab').setAttribute('aria-label', '指摘一覧を開閉する。' + description);
    el('detail').textContent = description;
    el('remaining').textContent = total - handled > 0 ? '未対応の指摘があります。採用するかは自分で判断します。' : '対応待ちの指摘はありません。文章の正しさを保証する表示ではありません。';
    el('actions').hidden = total === 0;
    el('apply').disabled = el('delete').disabled = handled === total;
    el('restore').disabled = handled === 0;
  }
  function readCounts() {
    total = Math.max(0, Math.floor(Number(el('total').value) || 0));
    handled = Math.min(total, Math.max(0, Math.floor(Number(el('handled').value) || 0)));
    render();
  }
  el('handled').addEventListener('change', readCounts);
  el('total').addEventListener('change', readCounts);
  el('fab').addEventListener('click', () => {
    el('panel').hidden = !el('panel').hidden;
    el('fab').setAttribute('aria-expanded', String(!el('panel').hidden));
  });
  el('apply').onclick = el('delete').onclick = () => { handled = Math.min(total, handled + 1); render(); };
  el('restore').onclick = () => { handled = Math.max(0, handled - 1); render(); };
  render();
</script>
</html>
